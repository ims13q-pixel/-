<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Login</title>
<style>
    body { background: #0b0e14; color: white; font-family: monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .box { background: #11151f; padding: 40px; border-radius: 12px; border: 1px solid #1e2433; width: 300px; text-align: center; }
    input { width: 100%; padding: 12px; margin: 10px 0; background: #0b0e14; border: 1px solid #1e2433; color: white; border-radius: 6px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px;}
    a { color: #3b82f6; text-decoration: none; font-size: 14px; display: block; margin-top: 15px;}
    .err { color: #ef4444; font-size: 14px; margin-bottom: 10px; display: none;}
</style>
</head>
<body>
<div class="box">
    <h2>{{ "Register" if mode == "register" else "Login" }}</h2>
    <div class="err" id="err"></div>
    <form id="form">
        <input type="text" id="user" placeholder="Username" required>
        <input type="password" id="pass" placeholder="Password" required>
        <button type="submit">{{ "Register" if mode == "register" else "Login" }}</button>
    </form>
    <a href="{{ '/login' if mode == 'register' else '/register' }}">
        {{ "Already have an account? Login" if mode == "register" else "Create an account" }}
    </a>
</div>
<script>
    document.getElementById('form').onsubmit = async (e) => {
        e.preventDefault();
        try {
            const res = await fetch(window.location.href, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    username: document.getElementById('user').value,
                    password: document.getElementById('pass').value
                })
            });
            const data = await res.json();
            if (res.ok) window.location.href = '/';
            else { document.getElementById('err').style.display = 'block'; document.getElementById('err').innerText = data.error; }
        } catch (e) { alert("Error connecting to server"); }
    };
</script>
</body>
</html>
