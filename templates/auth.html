<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Login - Blockspin Dashboard</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    :root { --bg: #0b0e14; --panel: #11151f; --border: #1e2433; --text: #ffffff; --dim: #8b93a3; --btn: #3b82f6; --btn-hover: #2563eb; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .card { background: var(--panel); padding: 40px; border-radius: 12px; border: 1px solid var(--border); width: 100%; max-width: 350px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h2 { margin-top: 0; text-align: center; font-weight: 600; }
    input { width: 100%; padding: 12px; margin-bottom: 15px; background: var(--bg); border: 1px solid var(--border); color: white; border-radius: 8px; box-sizing: border-box; font-family: inherit; outline: none; transition: border 0.2s; }
    input:focus { border-color: var(--btn); }
    button { width: 100%; padding: 12px; background: var(--btn); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: background 0.2s; font-family: inherit; font-size: 14px; }
    button:hover { background: var(--btn-hover); }
    .link { text-align: center; margin-top: 20px; font-size: 13px; color: var(--dim); }
    .link a { color: var(--btn); text-decoration: none; }
    .error { color: #ef4444; text-align: center; font-size: 13px; margin-bottom: 10px; display: none; }
</style>
</head>
<body>
    <div class="card">
        <h2>{{ "Register" if mode == "register" else "Login" }}</h2>
        <div id="error" class="error"></div>
        <form id="authForm">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">{{ "Create Account" if mode == "register" else "Sign In" }}</button>
        </form>
        <div class="link">
            {% if mode == "register" %}
                Already have an account? <a href="/login">Login</a>
            {% else %}
                Don't have an account? <a href="/register">Register</a>
            {% endif %}
        </div>
    </div>
    <script>
        document.getElementById('authForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.querySelector('button');
            const err = document.getElementById('error');
            btn.disabled = true; btn.textContent = '...'; err.style.display = 'none';
            
            try {
                const res = await fetch(window.location.href, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value
                    })
                });
                const data = await res.json();
                
                if (res.ok) {
                    window.location.href = '/';
                } else {
                    err.textContent = data.error;
                    err.style.display = 'block';
                }
            } catch (e) {
                err.textContent = 'Connection error';
                err.style.display = 'block';
            }
            btn.disabled = false; btn.textContent = 'Submit';
        };
    </script>
</body>
</html>
