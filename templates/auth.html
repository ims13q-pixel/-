<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login - Farmledger</title>
<style>
    body { background: #0B0E14; color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-image: radial-gradient(circle at 50% 0%, rgba(59, 130, 246, 0.1) 0%, transparent 50%);}
    .box { background: #12161f; padding: 40px; border-radius: 16px; border: 1px solid #232936; width: 100%; max-width: 380px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
    h2 { text-align: center; margin-top: 0; font-weight: 800; letter-spacing: -0.5px; font-size: 24px; color: #fff;}
    input { width: 100%; padding: 14px; margin-bottom: 15px; background: #0B0E14; border: 1px solid #232936; color: white; border-radius: 10px; box-sizing: border-box; outline: none; font-family: 'Plus Jakarta Sans', sans-serif;}
    input:focus { border-color: #4b5263; }
    button { width: 100%; padding: 14px; background: #ffffff; color: #000; border: none; border-radius: 10px; cursor: pointer; font-weight: 700; font-size: 14px; transition: 0.2s;}
    button:hover { background: #e2e2e2; }
    .err { color: #ef4444; margin-bottom: 15px; text-align: center; display: none; font-size: 13px; font-weight: 600; word-break: break-all;}
    a { color: #8f96a3; text-decoration: none; display: block; text-align: center; margin-top: 20px; font-size: 13px; font-weight: 500;}
    a:hover { color: #fff; }
    .divider { display: flex; align-items: center; text-align: center; margin: 20px 0; color: #4b5263; font-size: 12px; font-weight: 600;}
    .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #232936; }
    .divider:not(:empty)::before { margin-right: .25em; }
    .divider:not(:empty)::after { margin-left: .25em; }
</style>
</head>
<body>
<div class="box">
    <h2>{{ "Register" if mode == "register" else "Login" }}</h2>
    <div class="err" id="err"></div>
    <form id="form">
        <input type="text" id="user" placeholder="Username" required autocomplete="off">
        <input type="password" id="pass" placeholder="Password" required>
        <button type="submit">{{ "Create Account" if mode == "register" else "Sign In" }}</button>
    </form>

    <div class="divider">OR</div>
    <a href="/auth/discord" style="background: #5865F2; color: white; margin-top: 10px; display: flex; justify-content: center; align-items: center; gap: 8px; text-decoration: none; padding: 14px; border-radius: 10px; font-weight: 700; font-size: 14px;">
        Login with Discord
    </a>

    <a href="{{ '/login' if mode == 'register' else '/register' }}">
        {{ "Already have an account? Login" if mode == "register" else "Create an account" }}
    </a>
</div>
<script>
    document.getElementById('form').onsubmit = async (e) => {
        e.preventDefault();
        const errDiv = document.getElementById('err');
        errDiv.style.display = 'none';
        
        try {
            const res = await fetch(window.location.href, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    username: document.getElementById('user').value,
                    password: document.getElementById('pass').value
                })
            });
            
            const text = await res.text();
            let data;
            try { data = JSON.parse(text); } catch(e) { data = { error: text }; }

            if (res.ok) {
                window.location.href = '/';
            } else { 
                errDiv.style.display = 'block'; 
                // 🔴 راح يعرض لك الخطأ الحقيقي هنا
                errDiv.innerText = data.error || "Server Error"; 
            }
        } catch (err) { 
            errDiv.style.display = 'block'; 
            errDiv.innerText = "Connection Error: " + err.message; 
        }
    };
</script>
</body>
</html>
