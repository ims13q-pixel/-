<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AXIOM LOGS | Auth</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    
    * { box-sizing: border-box; }
    body { 
        margin: 0; 
        background: #0b0e14; 
        color: #ffffff; 
        font-family: 'Inter', sans-serif; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        height: 100vh; 
    }
    
    .auth-card { 
        background: #11151f; 
        padding: 40px; 
        border-radius: 16px; 
        border: 1px solid #1e2433; 
        width: 100%; 
        max-width: 400px; 
        box-shadow: 0 10px 40px rgba(0,0,0,0.6); 
    }
    
    h2 { margin: 0 0 30px 0; text-align: center; font-size: 24px; font-weight: 700; letter-spacing: -0.5px;}
    
    .input-group { margin-bottom: 20px; }
    label { display: block; font-size: 12px; color: #8b93a3; margin-bottom: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    
    input { 
        width: 100%; 
        padding: 14px; 
        background: #0b0e14; 
        border: 1px solid #1e2433; 
        color: white; 
        border-radius: 8px; 
        font-family: 'Inter', sans-serif; 
        font-size: 14px;
        outline: none; 
        transition: border 0.2s, box-shadow 0.2s; 
    }
    input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
    
    button { 
        width: 100%; 
        padding: 14px; 
        background: #3b82f6; 
        color: white; 
        border: none; 
        border-radius: 8px; 
        font-weight: 600; 
        font-size: 15px; 
        cursor: pointer; 
        transition: background 0.2s; 
        margin-top: 10px;
        font-family: 'Inter', sans-serif;
    }
    button:hover { background: #2563eb; }
    
    .error-msg { color: #ef4444; font-size: 13px; margin-bottom: 15px; text-align: center; display: none; background: rgba(239,68,68,0.1); padding: 10px; border-radius: 8px; border: 1px solid rgba(239,68,68,0.2);}
    
    .link { text-align: center; margin-top: 25px; font-size: 13px; color: #8b93a3; }
    .link a { color: #3b82f6; text-decoration: none; font-weight: 600; transition: 0.2s;}
    .link a:hover { text-decoration: underline; }
</style>
</head>
<body>
    <div class="auth-card">
        <h2>{{ "Create Account" if mode == "register" else "Welcome Back" }}</h2>
        
        <div id="error-msg" class="error-msg"></div>
        
        <form id="authForm">
            <div class="input-group">
                <label>Username (Min 4 chars)</label>
                <input type="text" id="username" placeholder="Enter your username" required minlength="4">
            </div>
            <div class="input-group">
                <label>Password (Min 4 chars)</label>
                <input type="password" id="password" placeholder="Enter your password" required minlength="4">
            </div>
            <button type="submit" id="submit-btn">{{ "Register" if mode == "register" else "Login" }}</button>
        </form>
        
        <div class="link">
            {% if mode == "register" %}
                Already have an account? <a href="/login">Login here</a>
            {% else %}
                Don't have an account? <a href="/register">Register now</a>
            {% endif %}
        </div>
    </div>

    <script>
        document.getElementById('authForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const errDiv = document.getElementById('error-msg');
            
            btn.disabled = true; btn.textContent = 'Wait...'; errDiv.style.display = 'none';
            
            try {
                const res = await fetch(window.location.href, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value
                    })
                });
                const data = await res.json();
                
                if (res.ok) {
                    window.location.href = '/'; // نجاح، نروح للوحة التحكم
                } else {
                    errDiv.textContent = data.error;
                    errDiv.style.display = 'block';
                    btn.disabled = false; btn.textContent = '{{ "Register" if mode == "register" else "Login" }}';
                }
            } catch (e) {
                errDiv.textContent = 'Connection error. Try again.';
                errDiv.style.display = 'block';
                btn.disabled = false; btn.textContent = '{{ "Register" if mode == "register" else "Login" }}';
            }
        };
    </script>
</body>
</html>
