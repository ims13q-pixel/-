<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login - OVERSEER</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    body { background: #080b12; color: #fff; font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .box { background: #0e141d; padding: 40px; border-radius: 16px; border: 1px solid #1c2636; width: 100%; max-width: 350px; box-shadow: 0 10px 40px rgba(0,0,0,0.6); }
    h2 { text-align: center; margin-top: 0; font-weight: 800; margin-bottom: 25px;}
    input { width: 100%; padding: 14px; margin-bottom: 15px; background: #080b12; border: 1px solid #1c2636; color: white; border-radius: 10px; box-sizing: border-box; font-family: inherit; outline: none; transition: 0.2s; }
    input:focus { border-color: #6aa8ff; box-shadow: 0 0 0 3px rgba(106,168,255,0.1); }
    button { width: 100%; padding: 14px; background: #6aa8ff; color: #07101d; border: none; border-radius: 10px; cursor: pointer; font-weight: 800; font-size: 15px; transition: 0.2s; }
    button:hover { background: #589ceb; }
    .err { color: #fb6d78; font-size: 13px; margin-bottom: 15px; text-align: center; display: none; background: rgba(251,109,120,0.1); padding: 10px; border-radius: 8px; border: 1px solid rgba(251,109,120,0.2);}
    a { color: #6aa8ff; text-decoration: none; display: block; text-align: center; margin-top: 20px; font-size: 14px; font-weight: 600;}
</style>
</head>
<body>
<div class="box">
    <h2>{{ "Register" if mode == "register" else "Login" }}</h2>
    <div class="err" id="err"></div>
    <form id="form">
        <input type="text" id="user" placeholder="Username (Min 4 chars)" required>
        <input type="password" id="pass" placeholder="Password (Min 4 chars)" required>
        <button type="submit">{{ "Create Account" if mode == "register" else "Sign In" }}</button>
    </form>
    <a href="{{ '/login' if mode == 'register' else '/register' }}">
        {{ "Already have an account? Login" if mode == "register" else "Create an account" }}
    </a>
</div>
<script>
    document.getElementById('form').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.querySelector('button');
        const err = document.getElementById('err');
        btn.disabled = true; btn.textContent = 'Wait...'; err.style.display = 'none';
        
        try {
            const res = await fetch(window.location.href, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    username: document.getElementById('user').value,
                    password: document.getElementById('pass').value
                })
            });
            const data = await res.json();
            if (res.ok) window.location.href = '/';
            else { 
                err.textContent = data.error; 
                err.style.display = 'block'; 
                btn.disabled = false; 
                btn.textContent = '{{ "Create Account" if mode == "register" else "Sign In" }}'; 
            }
        } catch (error) {
            err.textContent = "Connection failed."; 
            err.style.display = 'block'; 
            btn.disabled = false; 
            btn.textContent = '{{ "Create Account" if mode == "register" else "Sign In" }}';
        }
    };
</script>
</body>
</html>
