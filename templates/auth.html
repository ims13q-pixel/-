<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login - OVERSEER</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    
    * { box-sizing: border-box; }
    
    body { 
        background: #080a10; 
        color: #fff; 
        font-family: 'Inter', sans-serif; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        min-height: 100vh; 
        margin: 0; 
        padding: 20px;
    }
    
    .box { 
        background: #0d0f16; 
        padding: 40px 30px; 
        border-radius: 16px; 
        border: 1px solid #1c2130; 
        width: 100%; 
        max-width: 380px; 
        box-shadow: 0 10px 40px rgba(0,0,0,0.6); 
    }
    
    h2 { text-align: center; margin-top: 0; margin-bottom: 25px; font-weight: 800; font-size: 22px; }
    
    input { 
        width: 100%; 
        padding: 16px; 
        margin-bottom: 15px; 
        background: #080a10; 
        border: 1px solid #1c2130; 
        color: white; 
        border-radius: 10px; 
        font-family: inherit; 
        font-size: 15px;
        outline: none; 
        transition: 0.2s; 
    }
    
    input:focus { 
        border-color: #3b82f6; 
        box-shadow: 0 0 0 3px rgba(59,130,246,0.1); 
    }
    
    button { 
        width: 100%; 
        padding: 16px; 
        background: #3b82f6; 
        color: white; 
        border: none; 
        border-radius: 10px; 
        cursor: pointer; 
        font-weight: 700; 
        font-size: 16px; 
        transition: 0.2s; 
        margin-top: 5px;
    }
    
    button:hover { background: #2563eb; }
    
    .err { 
        color: #ef4444; 
        font-size: 13px; 
        margin-bottom: 15px; 
        text-align: center; 
        display: none; 
        background: rgba(239,68,68,0.1); 
        padding: 12px; 
        border-radius: 10px; 
        border: 1px solid rgba(239,68,68,0.2);
    }
    
    a { 
        color: #3b82f6; 
        text-decoration: none; 
        display: block; 
        text-align: center; 
        margin-top: 20px; 
        font-size: 14px; 
        font-weight: 600;
    }

    /* 📱 تعديلات الجوال عشان المربع يكون كبير ومرتاح 📱 */
    @media (max-width: 600px) {
        body { padding: 15px; align-items: flex-start; padding-top: 50px; } /* يرفع المربع لفوق شوي عشان ما يكون في النص بعيد */
        .box { padding: 30px 20px; max-width: 100%; border-radius: 12px; }
        h2 { font-size: 20px; }
        input { padding: 14px; font-size: 16px; } /* 16px يمنع الآيفون من تكبير الشاشة تلقائياً */
        button { padding: 14px; }
    }
</style>
</head>
<body>
<div class="box">
    <h2>{{ "Create Account" if mode == "register" else "Welcome Back" }}</h2>
    <div class="err" id="err"></div>
    <form id="form">
        <input type="text" id="user" placeholder="Username (Min 4 chars)" required>
        <input type="password" id="pass" placeholder="Password (Min 4 chars)" required>
        <button type="submit" id="submit-btn">{{ "Register" if mode == "register" else "Login" }}</button>
    </form>
    <a href="{{ '/login' if mode == 'register' else '/register' }}">
        {{ "Already have an account? Login" if mode == "register" else "Create an account" }}
    </a>
</div>
<script>
    document.getElementById('form').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submit-btn');
        const err = document.getElementById('err');
        
        btn.disabled = true; btn.textContent = 'Wait...'; err.style.display = 'none';
        
        try {
            const res = await fetch(window.location.href, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    username: document.getElementById('user').value,
                    password: document.getElementById('pass').value
                })
            });
            const data = await res.json();
            if (res.ok) window.location.href = '/';
            else { 
                err.textContent = data.error; 
                err.style.display = 'block'; 
                btn.disabled = false; 
                btn.textContent = '{{ "Register" if mode == "register" else "Login" }}'; 
            }
        } catch (error) {
            err.textContent = "Connection failed."; 
            err.style.display = 'block'; 
            btn.disabled = false; 
            btn.textContent = '{{ "Register" if mode == "register" else "Login" }}';
        }
    };
</script>
</body>
</html>
