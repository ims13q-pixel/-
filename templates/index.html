<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Farmledger - Account Log</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Bricolage+Grotesque:wght@600;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{--bg:#0a0b14;--p:#12141f;--p2:#181b29;--line:#252a3d;--ink:#eceffa;--mute:#7d86a6;--ac:#7c8cff;--ac2:#3a46c8;--gold:#ffc15a;--ok:#3ddc97;--bad:#ff6b7d;--warn:#ffb347;--glow:rgba(124,140,255,.16);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eef0f8;--p:#fff;--p2:#f4f5fb;--line:#d9ddee;--ink:#161a2e;--mute:#68719a;--ac:#4150e0;--gold:#b86e00;--ok:#13915c;--bad:#d03a50;--warn:#b86e00;--glow:rgba(65,80,224,.12);color-scheme:light}}
:root[data-theme="light"]{--bg:#eef0f8;--p:#fff;--p2:#f4f5fb;--line:#d9ddee;--ink:#161a2e;--mute:#68719a;--ac:#4150e0;--gold:#b86e00;--ok:#13915c;--bad:#d03a50;--warn:#b86e00;--glow:rgba(65,80,224,.12);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 14px/1.5 Manrope,system-ui,sans-serif}
.w{max-width:1280px;margin:0 auto;padding:18px 18px 60px}
button,input{font:inherit;color:inherit}:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.logo{font:800 20px 'Bricolage Grotesque',sans-serif;letter-spacing:-.02em;display:flex;align-items:center;gap:9px}
.logo i{width:26px;height:26px;border-radius:8px;background:conic-gradient(from 200deg,var(--ac),var(--ac2),var(--ok),var(--ac));display:block}
.meta{color:var(--mute);font-size:13px;display:flex;gap:16px;flex-wrap:wrap}.meta b{color:var(--ink)}
.sp{flex:1}
.b{background:var(--p);border:1px solid var(--line);border-radius:9px;padding:7px 14px;cursor:pointer;font-weight:700;font-size:13px}
.b:hover{border-color:var(--ac)}.b.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.b.live.on{border-color:var(--ok);color:var(--ok)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mute);margin-inline-end:7px}.on .dot{background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:pu 1.6s infinite}
@keyframes pu{70%{box-shadow:0 0 0 7px transparent}}
@media (prefers-reduced-motion:reduce){.on .dot{animation:none}}
.hero{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;margin-bottom:14px}
.card{background:var(--p);border:1px solid var(--line);border-radius:16px;padding:20px;position:relative;overflow:hidden}
.net{background:radial-gradient(120% 140% at 0% 0%,var(--glow),transparent 60%),var(--p)}
.lbl{color:var(--mute);font-size:12px;font-weight:700}
.big{font:800 clamp(38px,6vw,64px)/1 'Bricolage Grotesque',sans-serif;letter-spacing:-.03em;margin:6px 0 2px}
.sub{color:var(--mute);font-size:13px}
#spark{display:block;width:100%;height:110px;margin-top:12px}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.kp .card{padding:16px}.kv{font:800 26px 'Bricolage Grotesque',sans-serif;letter-spacing:-.02em}
.up{color:var(--ok)}.dn{color:var(--bad)}.gd{color:var(--gold)}
.ring{display:flex;align-items:center;gap:14px}
.mach{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:14px}
.m{background:var(--p);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;text-align:start}
.m:hover,.m.act{border-color:var(--ac)}.m.act{box-shadow:0 0 0 1px var(--ac) inset}
.m h3{margin:0;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.pg{height:6px;border-radius:9px;background:var(--p2);margin:10px 0 8px;overflow:hidden}.pg i{display:block;height:100%;background:linear-gradient(90deg,var(--ac2),var(--ac));border-radius:9px}
.m div.r{display:flex;justify-content:space-between;color:var(--mute);font-size:12px}.m div.r b{color:var(--ink)}
.tb{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.ch{background:var(--p);border:1px solid var(--line);border-radius:99px;padding:5px 13px;cursor:pointer;font-size:13px;font-weight:700;color:var(--mute)}
.ch.act{background:var(--ac);border-color:var(--ac);color:#fff}.ch em{font-style:normal;opacity:.75;margin-inline-start:5px}
.tb input[type=search]{background:var(--p);border:1px solid var(--line);border-radius:9px;padding:8px 13px;min-width:220px}
.tw{background:var(--p);border:1px solid var(--line);border-radius:16px;overflow:auto;max-height:640px}
table{border-collapse:collapse;width:100%;min-width:1040px}
th{position:sticky;top:0;background:var(--p2);color:var(--mute);font-size:12px;font-weight:700;text-align:start;padding:11px 12px;cursor:pointer;user-select:none;white-space:nowrap;z-index:1}
th[aria-sort]{color:var(--ink)}th[aria-sort]::after{content:" \2191";color:var(--ac)}th[aria-sort=descending]::after{content:" \2193"}
td{padding:9px 12px;border-top:1px solid var(--line);white-space:nowrap}
tbody tr:hover{background:var(--p2)}tr.sel{background:var(--glow)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:99px;font-size:12px;font-weight:800;border:1px solid}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor}
.s-online{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.s-offline{color:var(--mute);border-color:var(--line)}
.s-captcha{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.s-banned{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.pc{background:color-mix(in srgb,var(--ac) 14%,transparent);color:var(--ac);border:1px solid color-mix(in srgb,var(--ac) 35%,transparent);padding:2px 10px;border-radius:7px;font-size:12px;font-weight:800}
.u{font:500 13px 'JetBrains Mono',monospace;background:var(--p2);border:1px solid var(--line);border-radius:7px;padding:3px 9px;cursor:copy}
.u:hover{border-color:var(--ac)}
.lv{display:inline-block;min-width:34px;text-align:center;padding:2px 7px;border-radius:7px;font-size:12px;font-weight:800;margin-inline-end:4px;background:var(--p2);border:1px solid var(--line)}
.lv.t{color:var(--gold)}.lv.a{color:#66d4ff}.lv.c{color:#ff8fd0}
.n{font-variant-numeric:tabular-nums;font-weight:800}
.eco{font-size:12px;font-weight:800}.eco.g{color:var(--ok)}.eco.l{color:var(--warn)}.eco.d{color:var(--bad)}
.empty{padding:36px;text-align:center;color:var(--mute)}
.bulk{position:fixed;inset-inline:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));margin:auto;width:max-content;max-width:94vw;background:var(--p2);border:1px solid var(--ac);border-radius:14px;padding:10px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 12px 40px rgba(0,0,0,.4)}
.bulk[hidden]{display:none}
dialog{background:var(--p);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:22px;width:min(400px,92vw)}dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h2{margin:0 0 12px;font:800 20px 'Bricolage Grotesque'}dialog label{display:block;margin-bottom:10px;color:var(--mute);font-size:12px;font-weight:700}
dialog input{width:100%;margin-top:4px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:800px){.hero{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="w">
<div class="bar">
  <div class="logo"><i></i>Farmledger</div>
  <div class="meta"><span><b id="mAcc">0</b> accounts</span><span><b id="mLive">0</b> live</span><span>session <b id="mSes">0h</b></span></div>
  <div class="sp"></div>
  <button class="b live on" id="live"><span class="dot"></span>Live</button>
  <button class="b" id="exp">Export CSV</button>
</div>

<div class="hero">
  <div class="card net">
    <div class="lbl">Total net worth</div>
    <div class="big" id="nw">$0</div>
    <div class="sub" id="nwSub"></div>
    <svg id="spark" viewBox="0 0 600 110" preserveAspectRatio="none" aria-label="Net worth trend"></svg>
  </div>
  <div class="kp">
    <div class="card"><div class="lbl">Session profit</div><div class="kv up" id="kp1"></div><div class="sub" id="kp1s"></div></div>
    <div class="card"><div class="lbl">Hourly rate</div><div class="kv up" id="kp2"></div><div class="sub">this session</div></div>
    <div class="card"><div class="lbl">Daily estimate</div><div class="kv gd" id="kp3"></div><div class="sub">hourly rate x 24</div></div>
    <div class="card ring"><svg width="62" height="62" viewBox="0 0 62 62"><circle cx="31" cy="31" r="25" fill="none" stroke="var(--p2)" stroke-width="7"/><circle id="rg" cx="31" cy="31" r="25" fill="none" stroke="var(--ok)" stroke-width="7" stroke-linecap="round" stroke-dasharray="157" stroke-dashoffset="157" transform="rotate(-90 31 31)"/></svg><div><div class="lbl">Health</div><div class="kv" id="kp4"></div></div></div>
  </div>
</div>

<div class="mach" id="mach"></div>

<div class="tb" id="chips"></div>
<div class="tb"><input type="search" id="q" placeholder="Search username or machine" aria-label="Search"><span class="sub" id="cnt"></span></div>

<div class="tw"><table><thead><tr id="th"></tr></thead><tbody id="tbd"></tbody></table><div class="empty" id="emp" hidden>No accounts match. Clear the filters or add an account.</div></div>
</div>

<div class="bulk" id="bulk" hidden><b id="bn"></b><button class="b" id="bcopy">Copy usernames</button><button class="b" id="bdel" style="color:var(--bad)">Delete</button><button class="b" id="bclr">Clear</button></div>

<script>
// 🔴 ربط بيانات البايثون مع الجافاسكربت
const SERVER_DATA = {
    accounts: {{ accounts | tojson | safe }},
    stats: {{ stats | tojson | safe }},
    my_key: {{ my_key | tojson | safe }}
};

var $=function(i){return document.getElementById(i)},R=function(a,b){return a+Math.random()*(b-a)};
var seed=7;function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647}
var PCS=["XEON V4","RYZEN 02","DDC-1"];

// تحويل البيانات من البايثون إلى الشكل اللي التصميم يحتاجه
var accs = [];
if (SERVER_DATA && SERVER_DATA.accounts) {
    accs = SERVER_DATA.accounts.map(function(a, i) {
        let stamina = (a.skills && a.skills['stamina']) ? a.skills['stamina'] : 0;
        let swiper = (a.skills && a.skills['swiper']) ? a.skills['swiper'] : 0;
        let total = a.cash + a.bank;
        return {
            id: i + 1,
            user: a.name,
            pc: a.pc || "MR 1",
            st: a.online ? "online" : "offline",
            pocket: a.cash || 0,
            bank: a.bank || 0,
            l: [a.total_level || 0, stamina, swiper],
            mins: Math.floor((a.uptime || 0) / 60),
            h: [total, total], // رسم بياني وهمي بسيط
            sel: 0
        };
    });
}

var ses0=Date.now()-13.8*36e5,G=[],flt="all",pcf="",q="",sk="bank",sd=-1,live=true;

var tot=function(a){return a.pocket+a.bank};
var $$=function(){return accs.reduce(function(s,a){return s+tot(a)},0)};
var base=$$()*.2;for(var g=0;g<40;g++)G.push(base+($$()-base)*(g/39)*(0.9+rnd()*.1));

function M(n){var s=n<0?"-":"";n=Math.abs(n);return s+"$"+(n>=1e6?(n/1e6).toFixed(2)+"M":n>=1e3?(n/1e3).toFixed(1)+"K":Math.round(n))}
function eco(a){var t=tot(a);return t>=20000?["Good","g"]:t>=6000?["Low balance","l"]:["Drained","d"]}
var cols=[["st","Status"],["pc","Machine"],["user","Username"],["eco","Economy"],["mins","Online"],["l0","Levels"],["pocket","Pocket"],["bank","Bank"],["tot","Total"],["h","Trend"]];
function val(a,k){return k==="tot"?tot(a):k==="eco"?tot(a):k==="l0"?a.l[0]:k==="h"?a.h[a.h.length-1]-a.h[0]:a[k]}
function spark(arr,w,h,col,fill){var mn=Math.min.apply(0,arr),mx=Math.max.apply(0,arr),d=mx-mn||1,p=arr.map(function(v,i){return(i/(arr.length-1)*w).toFixed(1)+","+(h-3-(v-mn)/d*(h-8)).toFixed(1)});
 return(fill?'<path d="M0,'+h+' L'+p.join(" L")+' L'+w+','+h+'Z" fill="url(#gf)"/>':"")+'<polyline points="'+p.join(" ")+'" fill="none" stroke="'+col+'" stroke-width="'+(fill?2.5:1.8)+'" stroke-linejoin="round" stroke-linecap="round"/>'}

function top(){var T=$$(),hrs=(Date.now()-ses0)/36e5,pr=T-base,hr=pr/hrs,live=accs.filter(function(a){return a.st==="online"}).length,good=accs.filter(function(a){return a.st==="online"||a.st==="offline"}).length;
 $("mAcc").textContent=accs.length;$("mLive").textContent=live;$("mSes").textContent=Math.floor(hrs)+"h "+Math.floor(hrs%1*60)+"m";
 $("nw").textContent=M(T);$("nwSub").textContent="Average "+M(T/(accs.length||1))+" per account  |  Pocket "+M(accs.reduce(function(s,a){return s+a.pocket},0))+"  |  Bank "+M(accs.reduce(function(s,a){return s+a.bank},0));
 $("kp1").textContent="+"+M(pr);$("kp1s").textContent="over "+Math.floor(hrs)+"h "+Math.floor(hrs%1*60)+"m";$("kp2").textContent=M(hr);$("kp3").textContent=M(hr*24);
 var hp=accs.length?good/accs.length:0;$("kp4").textContent=Math.round(hp*100)+"%";$("rg").style.strokeDashoffset=157*(1-hp);
 $("spark").innerHTML='<defs><linearGradient id="gf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--ac)" stop-opacity=".35"/><stop offset="1" stop-color="var(--ac)" stop-opacity="0"/></linearGradient></defs>'+spark(G,600,110,"var(--ac)",1);
 var h="";PCS.concat(accs.map(function(a){return a.pc})).filter(function(v,i,s){return s.indexOf(v)===i}).forEach(function(p){var l=accs.filter(function(a){return a.pc===p});if(!l.length)return;var on=l.filter(function(a){return a.st==="online"}).length,nw=l.reduce(function(s,a){return s+tot(a)},0);
 h+='<button class="m'+(pcf===p?" act":"")+'" data-p="'+p+'"><h3>'+p+'<span class="pill s-'+(on?"online":"offline")+'"><i></i>'+(on?"Online":"Offline")+'</span></h3><div class="pg"><i style="width:'+on/l.length*100+'%"></i></div><div class="r"><span><b>'+on+'</b> / '+l.length+' running</span><span>Net <b>'+M(nw)+'</b></span></div></button>'});
 $("mach").innerHTML=h;[].forEach.call($("mach").children,function(b){b.onclick=function(){pcf=pcf===b.dataset.p?"":b.dataset.p;draw()}})}

function chips(){var c={all:accs.length};accs.forEach(function(a){c[a.st]=(c[a.st]||0)+1});
 $("chips").innerHTML=["all","online","offline","captcha","banned"].map(function(s){return'<button class="ch'+(flt===s?" act":"")+'" data-s="'+s+'">'+s[0].toUpperCase()+s.slice(1)+'<em>'+(c[s]||0)+'</em></button>'}).join("");
 [].forEach.call($("chips").children,function(b){b.onclick=function(){flt=b.dataset.s;draw()}})}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

function rows(){$("th").innerHTML='<th><input type="checkbox" id="all" aria-label="Select all"></th>'+cols.map(function(c){return'<th data-k="'+c[0]+'"'+(sk===c[0]?' aria-sort="'+(sd>0?"ascending":"descending")+'"':"")+'>'+c[1]+'</th>'}).join("");
 var v=accs.filter(function(a){return(flt==="all"||a.st===flt)&&(!pcf||a.pc===pcf)&&(!q||(a.user+" "+a.pc).toLowerCase().indexOf(q)>-1)}).sort(function(a,b){var x=val(a,sk),y=val(b,sk);return(typeof x==="string"?x.localeCompare(y):x-y)*sd});
 $("emp").hidden=v.length>0;$("cnt").textContent=v.length+" of "+accs.length+" shown";
 $("tbd").innerHTML=v.map(function(a){var e=eco(a),m=Math.floor(a.mins/60)+"h "+String(a.mins%60).padStart(2,"0")+"m",up=a.h[a.h.length-1]>=a.h[0];
 return'<tr class="'+(a.sel?"sel":"")+'"><td><input type="checkbox" data-i="'+a.id+'"'+(a.sel?" checked":"")+' aria-label="Select"></td><td><span class="pill s-'+a.st+'"><i></i>'+a.st[0].toUpperCase()+a.st.slice(1)+'</span></td><td><span class="pc">'+esc(a.pc)+'</span></td><td><span class="u" data-c="'+esc(a.user)+'" title="Click to copy">'+esc(a.user)+'</span></td><td class="eco '+e[1]+'">'+e[0]+'</td><td class="n">'+m+'</td><td><span class="lv t">'+a.l[0]+'</span><span class="lv a">'+a.l[1]+'</span><span class="lv c">'+a.l[2]+'</span></td><td class="n gd">'+M(a.pocket)+'</td><td class="n" style="color:#66d4ff">'+M(a.bank)+'</td><td class="n">'+M(tot(a))+'</td><td><svg width="70" height="24" viewBox="0 0 70 24">'+spark(a.h,70,24,up?"var(--ok)":"var(--bad)",0)+'</svg></td></tr>'}).join("");
 [].forEach.call($("th").querySelectorAll("th[data-k]"),function(t){t.onclick=function(){var k=t.dataset.k;if(sk===k)sd=-sd;else{sk=k;sd=-1}rows()}});
 [].forEach.call($("tbd").querySelectorAll("input[data-i]"),function(c){c.onchange=function(){accs.forEach(function(a){if(a.id==+c.dataset.i)a.sel=c.checked?1:0});rows();bulk()}});
 [].forEach.call($("tbd").querySelectorAll("[data-c]"),function(u){u.onclick=function(){try{navigator.clipboard.writeText(u.dataset.c);u.textContent="Copied";setTimeout(rows,700)}catch(e){}}});
 $("all").onchange=function(){v.forEach(function(a){a.sel=$("all").checked?1:0});rows();bulk()};bulk()}

function bulk(){var n=accs.filter(function(a){return a.sel}).length;$("bulk").hidden=!n;$("bn").textContent=n+" selected"}
function draw(){top();chips();rows()}
$("q").oninput=function(){q=this.value.trim().toLowerCase();rows()};
$("live").onclick=function(){live=!live;this.classList.toggle("on",live)};
$("bclr").onclick=function(){accs.forEach(function(a){a.sel=0});rows()};

// 🔴 ربط زر الحذف بالسيرفر
$("bdel").onclick=async function(){
    var selected = accs.filter(function(a){return a.sel}).map(function(a){return a.user});
    if(!selected.length) return;
    if(!confirm("Are you sure you want to delete " + selected.length + " account(s) from the database?")) return;
    
    for(var i=0; i<selected.length; i++){
        await fetch('/api/delete', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({name: selected[i]})
        });
    }
    location.reload();
};

$("bcopy").onclick=function(){try{navigator.clipboard.writeText(accs.filter(function(a){return a.sel}).map(function(a){return a.user}).join("\n"))}catch(e){}};

$("exp").onclick=function(){var t="\uFEFFstatus,machine,username,pocket,bank,total\n"+accs.map(function(a){return[a.st,a.pc,a.user,a.pocket,a.bank,tot(a)].join(",")}).join("\n");try{var l=document.createElement("a");l.href=URL.createObjectURL(new Blob([t],{type:"text/csv"}));l.download="accounts.csv";l.click()}catch(e){}};

// 🔴 شلنا الحركة الوهمية عشان البيانات تظل حقيقية 100%
// setInterval(function(){...}, 2200);

draw();
</script>
</body>
</html>
